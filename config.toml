[case]
name = "ASDEX_capil_03_coarse"

[geometry]
noz_type = "capillary"
throat_diam_mm = 0.4
throat_length_mm = 66

dim = 2
symmetry = "axial"
chamb_length_cm = 12
chamb_height_cm = 6

[gas]
species_file = "he.species"
plen_pres_pa = 100000
plen_temp_K = 300.15

[su2]
# Continuum domain only needs to reach a bit past the coupling plane;
# the far plume is DSMC territory. Sizes are in throat diameters.
ext_length_D = 20
ext_radius_D = 10
wall_temp_K = 300.15
faceplate = "wall"        # "wall" (isothermal) or "sym" (slip, no exit-plane wall)
# mesh (quads, structured blocks); grading solved so the first cell = first_cell_um
first_cell_um = 1.0       # cell size at tube wall, exit plane and lip
n_radial_tube = 40        # cells across tube radius, clustered to wall
n_axial_tube = 400        # cells along tube, clustered at exit
n_axial_ext = 150         # cells downstream of exit, clustered at exit
n_radial_ext = 100         # cells from lip to outer radius, clustered at lip
iterations = 150000
nprocs = 18

[sparta]
# DSMC domain: from the coupling plane to the end of the chamber, axis to chamber radius.
x_couple_D = "auto"            # coupling plane, throat diameters downstream of the exit
breakdown_module = "handoff.breakdown_2d"   # Boyd's full Kn_GLL over each plane
restart_every = 25000
base_grid = [200, 100]    # level-1 cells (x, r); refined 2x2 per level from the SU2 field
cells_per_mfp = 3         # refine until cell size <= local mean free path / this
ppc_target = 20           # particles per refined cell used to choose fnum
trans_iter = 25000       # hold time before calculations start
adapt_mesh = true         # Refine mesh after transient period
iter_tot = 50000         # total interation count
fnum = "auto"             # or a number (was 1.0e12); auto = from ppc_target
timestep_s = "auto"       # or a number (was 1.0e-8); auto = min(0.2 tau_coll, 0.5 cell transit)
dump_images = "true"     #fun pictures during transient phase of flow
dump_freq = 1000        #every 1000s steps
nprocs = 18